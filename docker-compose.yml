name: f1z-prime

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-f1z}
      POSTGRES_USER: ${POSTGRES_USER:-f1z}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # tuned for a 1 GB VPS
    command: >
      postgres -c shared_buffers=64MB -c work_mem=4MB -c maintenance_work_mem=32MB
      -c effective_cache_size=192MB -c max_connections=30 -c wal_buffers=4MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    logging: *logging

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    image: f1z-prime-backend:latest
    command: ["api"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-f1z}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-f1z}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: 256m
    logging: *logging

  bot:
    image: f1z-prime-backend:latest
    command: ["bot"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-f1z}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-f1z}
    depends_on:
      api: { condition: service_healthy }
    mem_limit: 192m
    logging: *logging

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 96m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
